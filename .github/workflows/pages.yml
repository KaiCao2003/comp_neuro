name: Validate and deploy GitHub Pages

on:
  push: {}
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install PDF metadata tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install
        working-directory: site
        run: npm ci
      - name: Validate content
        working-directory: site
        run: npm run validate
      - name: Test
        working-directory: site
        run: npm test
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Build static export
        working-directory: site
        env:
          PAGES_BASE_PATH: /comp_neuro
        run: npm run build
      - name: Validate static export
        working-directory: site
        env:
          PAGES_BASE_PATH: /comp_neuro
        run: npm run validate:export
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
